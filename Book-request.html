<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Request</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            margin: 0;
        }

        header, footer {
            background: #174a6e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #10354f;
            padding: 14px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }

        form {
            background: white;
            padding: 22px;
            border-radius: 8px;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #b8c5d0;
            border-radius: 6px;
        }

        legend {
            color: #174a6e;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .option {
            font-weight: normal;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            background: #174a6e;
            color: white;
            border: 0;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<header>
    <h1>Community Knowledge Library</h1>
    <p>Book Request Form</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="membership.html">Membership</a>
    <a href="book-request.html">Book Request</a>
    <a href="feedback.html">Feedback</a>
</nav>

<main>
    <h2>Request a Book</h2>
    <p>Provide the details of the book you need.</p>

    <form action="#" method="get">

        <fieldset>
            <legend>Member and Book Information</legend>

            <label for="member-name">Member's Full Name</label>
            <input type="text" id="member-name" name="member-name" required>

            <label for="book-title">Book Title</label>
            <input type="text" id="book-title" name="book-title" required>

            <label for="author">Author's Name</label>
            <input type="text" id="author" name="author" required>

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn"
                   pattern="[0-9Xx-]{10,17}"
                   title="Enter a 10- or 13-digit ISBN, with optional hyphens.">

            <label for="date-required">Date Required</label>
            <input type="date" id="date-required"
                   name="date-required" required>
        </fieldset>

        <fieldset>
            <legend>Book Category</legend>

            <label for="book-category">Select the Category</label>
            <select id="book-category" name="book-category" required>
                <option value="">-- Select a category --</option>
                <option value="computer-science">Computer Science</option>
                <option value="mathematics">Mathematics</option>
                <option value="chemistry">Chemistry</option>
                <option value="biology">Biology</option>
                <option value="education">Education</option>
                <option value="business">Business</option>
                <option value="literature">Literature</option>
                <option value="history">History</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Preferred Book Format</legend>

            <label class="option">
                <input type="radio" name="format" value="physical" required>
                Physical book
            </label>

            <label class="option">
                <input type="radio" name="format" value="ebook">
                E-book
            </label>

            <label class="option">
                <input type="radio" name="format" value="audiobook">
                Audiobook
            </label>
        </fieldset>

        <fieldset>
            <legend>Additional Book Requirements</legend>

            <label class="option">
                <input type="checkbox" name="requirements" value="new-edition">
                New edition
            </label>

            <label class="option">
                <input type="checkbox" name="requirements" value="large-print">
                Large print
            </label>

            <label class="option">
                <input type="checkbox" name="requirements" value="research">
                Research copy
            </label>

            <label class="option">
                <input type="checkbox" name="requirements" value="reference">
                Reference copy
            </label>
        </fieldset>

        <fieldset>
            <legend>Reason for the Request</legend>

            <label for="request-message">
                Explain why you need the book, the edition required,
                or any other information for the librarian.
            </label>

            <textarea id="request-message" name="request-message"
                      rows="6" required></textarea>
        </fieldset>

        <button type="submit">Submit Book Request</button>
        <button type="reset">Clear Form</button>

    </form>
</main>

<footer>
    <p>&copy; 2026 Knowledge hub Library</p>
</footer>

</body>
  </html>
